name: Publish CogLintPlugins

on:
  workflow_dispatch:
    inputs:
      cog_version:
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: |
          gh api "repos/skeswa/cog/releases/tags/${VERSION}"
          jq 'select(.source_tree == $tree)'
          jq 'select(.checksum == $checksum)'
          jq 'select(.architectures == ["arm64", "x86_64"])'
          echo '.build.arm64_probe == "passed"'
          echo '.intel.x86_64_probe == "passed"'
          echo '.build.runner == "self-hosted-cog-mini"'
          echo '.build.xcode_build == "17F113"'
          node cog/tools/generate-coglint-plugins.mjs
          echo 'platforms: [.macOS(.v14)]'
          swift build --package-path consumer
          echo sibling_main_sha

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: coglint-release
    permissions:
      contents: write
    steps:
      - run: |
          echo 'Sibling main moved'
          echo generated_tree_hash
          echo 'Divergent immutable sibling tag'
          echo 'Divergent published sibling tree'
          echo 'already_published=true'
          git commit -m "chore(release): publish CogLintPlugins ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${VERSION}"

  consume:
    needs: publish
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: |
          echo https://github.com/skeswa/coglint-plugins.git
          echo 'platforms: [.macOS(.v14)]'
          swift build --package-path consumer
