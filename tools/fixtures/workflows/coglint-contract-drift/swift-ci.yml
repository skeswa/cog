name: Drifted CogLint CI contract

on:
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - swift/**
      - mise.toml
      - .github/workflows/swift-ci.yml
  push:
    branches: [main]
    paths:
      - Package.swift
      - Package.resolved
      - swift/**
      - mise.toml
      - tools/**
      - .github/workflows/swift-ci.yml

# Keeps the generic least-privilege check green while `lint-swift` loses the
# job-local permission block that the CogLint contract deliberately requires.
permissions:
  contents: read

jobs:
  lint-swift:
    runs-on: [self-hosted, macOS, x64, cog-mini]
    timeout-minutes: 20
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - run: mise run test:lint

  fork-lint-swift:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: none
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - run: mise run lint:swift
