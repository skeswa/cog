name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@1111111111111111111111111111111111111111

  recover-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - run: echo no immutable recovery

  publish:
    needs: [release-please, recover-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - run: echo no provenance verification

  dispatch-docs:
    needs: publish
    # Names the right result and even carries a function, yet is still wrong:
    # `success()` *is* the implicit check, so this gate is skipped by exactly
    # the ancestor that skipped the unguarded form.
    if: success() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - run: echo no dispatch
