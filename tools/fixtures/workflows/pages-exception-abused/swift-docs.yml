name: Pages exception, abused

# Fixture: the three ways the Pages exception must not stretch.
#
# This file has the exempted name, so if the exception were a per-file switch
# rather than an exact scope list on one hosted job, every job below would slip
# through. Each must fire `least-privilege-permissions`:
#
#   `deploy`      — the right job, but asks for `contents: write` on top of the
#                   two allowed scopes.
#   `smuggler`    — the right scopes, the wrong job id.
#   `deploy-mini` — the right job id and the right scopes, but on the
#                   self-hosted runner, which is precisely where a write-scoped
#                   token must never land.
#
# `deploy-mini` also fires `self-hosted-guard`, because it carries no same-repo
# guard; that is expected and is asserted alongside.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy with an extra scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smuggler:
    name: The same scopes under another name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Report
        run: echo done

  deploy-mini:
    name: Deploy from the persistent runner
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Report
        run: echo done
