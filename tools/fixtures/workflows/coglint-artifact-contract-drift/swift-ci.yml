name: Drifted CogLint artifact CI contract

on:
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - swift/**
      - mise.toml
      - tools/**
      - .github/workflows/swift-ci.yml
  push:
    branches: [main]
    paths:
      - Package.swift
      - Package.resolved
      - swift/**
      - mise.toml
      - tools/**
      - .github/workflows/swift-ci.yml

permissions:
  contents: read

jobs:
  lint-swift:
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 20
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - run: mise run lint:swift

  fork-lint-swift:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - run: mise run lint:swift

  lint-artifact:
    runs-on: [self-hosted, macOS, x64, cog-mini]
    timeout-minutes: 30
    if: >-
      github.repository == 'skeswa/cog' && github.event_name ==
      'workflow_dispatch' && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - run: mise run build:lint-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coglint-latest
          path: swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip
          if-no-files-found: error
          compression-level: 6

  lint-artifact-x86_64:
    needs: lint-swift
    runs-on: macos-26
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coglint-latest
          path: /tmp/latest
      - run: uname -m
      - run: mise run test:lint-artifact
