[tools]
jj = "0.41.0"
node = "24"
"npm:oxfmt" = "0.62.0"

# Formatting is split per language under the `fmt` and `fmt:check` umbrellas.
# Oxfmt owns Markdown, JSON, and YAML; the Swift toolchain's own `swift format`
# owns Swift. There is no SwiftLint. A future `fmt:kotlin` joins the same
# umbrellas without touching either existing leg.

[tasks.fmt]
description = "Format everything in the repo"
depends = ["fmt:md", "fmt:swift"]

[tasks."fmt:md"]
description = "Format Markdown, JSON, and YAML with Oxfmt"
run = "oxfmt"

[tasks."fmt:swift"]
description = "Format Swift sources with the toolchain's swift-format"
run = "swift format --in-place --parallel --recursive swift Package.swift"

[tasks."fmt:check"]
description = "Verify formatting everywhere without writing changes"
depends = ["fmt:check:md", "fmt:check:swift"]

[tasks."fmt:check:md"]
description = "Verify Markdown, JSON, and YAML formatting"
run = "oxfmt --check"

[tasks."fmt:check:swift"]
description = "Lint Swift formatting strictly, writing nothing"
run = "swift format lint --strict --parallel --recursive swift Package.swift"

# Testing goes through `tools/swift-test.mjs`, never `swift test` directly.
# The wrapper gives every isolation-matrix leg and configuration its own
# SwiftPM scratch path, and — whenever `--filter` is passed — enumerates the
# built tests before running and fails when the expression selects none.
# SwiftPM exits 0 on an empty selection, so a raw `swift test --filter` can
# report a green for work it never ran. Extra arguments are passed straight
# through: `mise run test --filter 'DECL-01|ONE-04'`.

[tasks.test]
description = "Run the Swift tests on the default matrix leg"
run = "node {{config_root}}/tools/swift-test.mjs default --no-parallel"

[tasks."test:matrix"]
description = "Run the Swift tests across all four isolation-matrix legs"
run = "node {{config_root}}/tools/swift-test.mjs matrix --no-parallel"

[tasks."test:arena-configurations"]
description = "Test the specialized default and CompactArena trait"
run = "node {{config_root}}/tools/swift-test.mjs arena-configurations"

[tasks."test:release"]
description = "Run the Swift tests on the default leg in release configuration"
run = "node {{config_root}}/tools/swift-test.mjs release --no-parallel"

[tasks."api:check"]
description = "Compare supported Swift APIs with the latest release tag"
run = "node {{config_root}}/tools/check-swift-api.mjs"

[tasks."test:simulator"]
description = "Run only the boundary tests on the latest iOS simulator"
run = "node {{config_root}}/tools/swift-simulator-test.mjs"

[tasks."build:weather"]
description = "Build the Weather example for the iOS simulator"
run = """xcodebuild -quiet -project "{{config_root}}/swift/Examples/Weather/Weather.xcodeproj" -scheme Weather -configuration Debug -destination "generic/platform=iOS Simulator" -derivedDataPath "{{config_root}}/.build/weather-derived-data" CODE_SIGNING_ALLOWED=NO build"""

# `build:weather` uses xcodebuild's `build` action, which builds only the
# scheme's build-action entries — and the Weather scheme lists just
# `Weather.app` there. It therefore never compiles `WeatherTests`, so the
# example's behaviour proofs need their own command. Like the Swift test
# wrappers, `tools/weather-test.mjs` checks the executed-test count afterwards
# rather than trusting the exit status.

[tasks."test:weather"]
description = "Run the Weather example's tests on an iOS simulator"
run = "node {{config_root}}/tools/weather-test.mjs"

[tasks."build:todomvc"]
description = "Build the TodoMVC example for the iOS simulator"
run = """xcodebuild -quiet -project "{{config_root}}/swift/Examples/TodoMVC/TodoMVC.xcodeproj" -scheme TodoMVC -configuration Debug -destination "generic/platform=iOS Simulator" -derivedDataPath "{{config_root}}/.build/todomvc-derived-data" CODE_SIGNING_ALLOWED=NO build"""

# TodoMVC has the same build/test split as Weather. The app is the scheme's
# only build-action entry; the guarded test wrapper runs `TodoMVCTests` on a
# simulator and requires a nonzero authoritative executed count.

[tasks."test:todomvc"]
description = "Run the TodoMVC example's tests on an iOS simulator"
run = "node {{config_root}}/tools/todomvc-test.mjs"

# The Storefront macrobenchmark's neutral workload and Cog implementation are
# separate packages, so each correctness suite has a guarded wrapper. The
# guards are the ones every other Swift test command
# has: enumerate first, require every filter alternative to match, and read an
# authoritative executed count back out of an xUnit report the wrapper owns.
# This suite is the gate the Storefront benchmark numbers rest on, so a silently
# empty run would be worse here than almost anywhere else.

[tasks."test:storefront"]
description = "Run the guarded Storefront workload package tests"
run = "node {{config_root}}/tools/storefront-test.mjs"

[tasks."test:storefront-cog"]
description = "Run the guarded Cog Storefront runtime tests"
run = "node {{config_root}}/tools/storefront-cog-test.mjs"

# The comparison runtimes live in two further packages. Package separation
# keeps Observation free of both Cog and swift-state-graph, while the state-
# graph port alone resolves its macro toolchain. Every wrapper owns a scratch
# path of its own so builds for one runtime cannot invalidate another.

[tasks."test:storefront-runtimes"]
description = "Run the guarded plain-Swift Storefront comparison runtime tests"
run = "node {{config_root}}/tools/storefront-runtimes-test.mjs"

[tasks."test:storefront-state-graph"]
description = "Run the guarded swift-state-graph Storefront runtime tests"
run = "node {{config_root}}/tools/storefront-state-graph-test.mjs"

# The cross-runtime agreement suite lives in Storefront's Verification package,
# the sole integration point that can see all four runtimes. Individual runtime
# packages still cannot see one another. Its scratch path is separate from the
# runner so correctness and measurement builds cannot invalidate each other.

[tasks."test:storefront-agreement"]
description = "Run the guarded cross-runtime Storefront agreement suite"
run = "node {{config_root}}/tools/storefront-agreement-test.mjs"

[tasks."test:storefront-all"]
description = "Run every Storefront workload, comparison-runtime, and agreement suite"
depends = [
  "test:storefront",
  "test:storefront-cog",
  "test:storefront-runtimes",
  "test:storefront-state-graph",
  "test:storefront-agreement",
]
run = "echo '==> every Storefront suite passed'"

# The Storefront benchmark application is an Xcode project of its own under
# `swift/Benchmarks/Storefront/Apps/Cog`. It is not an example —
# `swift/Examples/` holds the Weather and TodoMVC worked examples —
# but it needs the same build/test split for the same reason: xcodebuild's
# `build` action builds only the scheme's build-action entries, and the
# StorefrontBench scheme lists just `Storefront.app` there.
#
# Its tests run in **release**, unlike the example apps'. Apple's performance-test
# guidance is explicit that a measured run builds for testing with the Release
# configuration and the debugger, code coverage, and runtime diagnostics off;
# the scheme carries those settings and the wrapper carries the configuration.

[tasks."build:storefront"]
description = "Build the Storefront benchmark app for the iOS simulator"
run = """xcodebuild -quiet -project "{{config_root}}/swift/Benchmarks/Storefront/Apps/Cog/Storefront.xcodeproj" -scheme StorefrontBench -configuration Debug -destination "generic/platform=iOS Simulator" -derivedDataPath "{{config_root}}/.build/storefront-derived-data" CODE_SIGNING_ALLOWED=NO build"""

[tasks."test:storefront-ui"]
description = "Run the Storefront UI performance tests on a pinned iOS simulator"
run = "node {{config_root}}/tools/storefront-ui-test.mjs"

# Compile-fail fixtures live outside every SwiftPM target and are type-checked
# in one batched `swiftc` pass, never one compiler invocation per test. The
# runner derives its flags from `Package.swift` rather than duplicating them,
# and fails both when a fixture misses its expected diagnostic and when a
# fixture stops failing altogether.

[tasks."test:compilefail"]
description = "Type-check every compile-fail fixture in one batched swiftc pass"
run = "node {{config_root}}/tools/check-compile-fail.mjs"

# CogLint is a separate package with a wrapper of its own. It enumerates tests
# before every run, validates every filter alternative, and owns the xUnit
# report used to reject an authoritative executed count of zero.
#
# The state-graph port's API-behavior probe sources are a lint input even though the probe
# is a throwaway measurement executable in a nested package outside every target.
# A directory no linter inspects is how a convention violation stays unnoticed,
# and that is exactly how the probe reached `main` with a class declaring no
# `nonisolated deinit`. It contains no Cog symbol, so no rule fires; the point is
# that the directory is covered rather than assumed clean.
#
# Storefront Verification is a test-role input on the same argument. Runner
# sources stay out because they are measurement apparatus rather than a worked
# example of how to write Cog.

[tasks."test:lint"]
description = "Run the guarded CogLint package tests"
run = "node {{config_root}}/tools/swift-lint-test.mjs"

[tasks."lint:swift"]
description = "Test CogLint, then check library, examples, workload, and runtime sources"
depends = ["test:lint"]
run = """
set -euo pipefail
echo "==> Cog, example apps, workload, and comparison-runtime production targets"
swift run --package-path "{{config_root}}/swift/Lint" coglint \
  --target-role production \
  "{{config_root}}/swift/Sources" \
  "{{config_root}}/swift/Benchmarks/Storefront/Workload/Sources" \
  "{{config_root}}/swift/Benchmarks/Storefront/Runtimes/CogRuntime/Sources" \
  "{{config_root}}/swift/Benchmarks/Storefront/Runtimes/Observation/Sources" \
  "{{config_root}}/swift/Benchmarks/Storefront/Runtimes/StateGraph/Sources" \
  "{{config_root}}/swift/Benchmarks/Storefront/Runtimes/StateGraph/Probes/APIBehavior/Sources" \
  "{{config_root}}/swift/Examples/Weather/Weather" \
  "{{config_root}}/swift/Examples/TodoMVC/TodoMVC" \
  "{{config_root}}/swift/Benchmarks/Storefront/Apps/Cog/Storefront"
echo "==> Cog, example apps, workload, and comparison-runtime test targets"
swift run --package-path "{{config_root}}/swift/Lint" coglint \
  --target-role test \
  "{{config_root}}/swift/Tests" \
  "{{config_root}}/swift/Benchmarks/Storefront/Workload/Tests" \
  "{{config_root}}/swift/Benchmarks/Storefront/Runtimes/CogRuntime/Tests" \
  "{{config_root}}/swift/Benchmarks/Storefront/Runtimes/Observation/Tests" \
  "{{config_root}}/swift/Benchmarks/Storefront/Runtimes/StateGraph/Tests" \
  "{{config_root}}/swift/Benchmarks/Storefront/Verification/Tests" \
  "{{config_root}}/swift/Examples/Weather/WeatherTests" \
  "{{config_root}}/swift/Examples/TodoMVC/TodoMVCTests" \
  "{{config_root}}/swift/Benchmarks/Storefront/Apps/Cog/StorefrontUITests"
"""

# CogLint ships as a checksummed SwiftPM artifact bundle with one native
# executable per supported macOS host. The build task creates the ignored
# development copy and release archive. The test task rebuilds it, then uses a
# scratch command plugin under arm64 and Rosetta to prove SwiftPM selects and
# executes the exact matching metadata variant.

[tasks."build:lint-artifact"]
description = "Build and checksum the CogLint macOS artifact bundle"
run = "node {{config_root}}/tools/build-coglint-artifact.mjs"

[tasks."test:lint-artifact"]
description = "Prove SwiftPM selects and executes both CogLint host variants"
run = "node {{config_root}}/tools/test-coglint-artifact.mjs"

[tasks."test:lint-build-tool-plugin"]
description = "Prove CogLint build-tool diagnostics and cache replay in SwiftPM and Xcode"
run = "node {{config_root}}/tools/test-coglint-build-tool-plugin.mjs"

[tasks."test:lint-command-plugin"]
description = "Prove CogLint command-plugin parity across target roles and reporters"
run = "node {{config_root}}/tools/test-coglint-command-plugin.mjs"

[tasks."build:lint-distribution"]
description = "Generate the Channel B CogLintPlugins distribution package"
run = "node {{config_root}}/tools/generate-coglint-plugins.mjs"

[tasks."test:lint-distribution"]
description = "Prove Channel B dependency and unused-artifact behavior"
run = "node {{config_root}}/tools/test-coglint-distribution.mjs"

[tasks."build:lint-documentation"]
description = "Generate CogLint rule articles from their executable fixtures"
run = "swift run --package-path {{config_root}}/swift/Lint --scratch-path {{config_root}}/.build/coglint-documentation CogLintDocGenerator --output {{config_root}}/swift/Sources/Cog/Cog.docc"

[tasks."test:lint-documentation"]
description = "Prove CogLint article fixture parity and permanent DocC routes"
run = "node {{config_root}}/tools/test-coglint-documentation.mjs"

# The workflow-contract check over `.github/workflows`: the same-repo guard on
# every self-hosted job, least-privilege `permissions:`, `persist-credentials:
# false`, job timeouts, no `pull_request_target`, and full-SHA action pins.
# The policy constants — including which labels count as self-hosted — live at
# the top of tools/lib/workflows/checks.mjs.

[tasks."workflows:check"]
description = "Verify the GitHub Actions workflow hardening contract"
depends = ["workflows:check:fixtures"]
run = "node {{config_root}}/tools/check-workflows.mjs"

[tasks."workflows:check:fixtures"]
description = "Run the workflow-contract checker against its fixtures"
run = "node {{config_root}}/tools/test-workflows.mjs"

# Revision descriptions are the release input, so the local jj range and the
# authoritative GitHub PR/push range share one checker. Its fixture suite uses
# real temporary git and colocated jj repositories in addition to individual
# message cases.

[tasks."changes:check"]
description = "Lint Conventional Commit descriptions in the current revision range"
depends = ["changes:check:fixtures"]
run = "node {{config_root}}/tools/check-changes.mjs"

[tasks."changes:check:fixtures"]
description = "Test Conventional Commit messages and Git and jj range selection"
run = """
node {{config_root}}/tools/test-changes.mjs
node {{config_root}}/tools/test-release-configuration.mjs
"""

# Benchmarks live in their own SwiftPM package under `swift/Benchmarks/Runner`, so
# every benchmark command runs there rather than at the repository root. The
# plugin always builds release; a debug measurement of a graph library measures
# the optimizer's absence. Extra arguments pass straight through, as in
# `mise run bench --filter perf-01-steady-turn`.

[tasks.bench]
description = "Run the Cog benchmarks in release"
dir = "{{config_root}}/swift/Benchmarks/Runner"
run = "swift package benchmark"

[tasks."bench:compact"]
description = "Run the Cog benchmarks with the CompactArena trait"
dir = "{{config_root}}/swift/Benchmarks/Runner"
run = "swift package --traits CompactArena benchmark"

# Benchmark baselines, through `tools/bench-baseline.mjs`. The benchmark
# package is a package of its own, so these tasks run there rather than at the
# repository root. A baseline is a statement about one machine and one
# toolchain: `update` records the environment beside it, and `check` refuses to
# compare across environments rather than producing a plausible answer. `check`
# also asserts that the allocation witness still reports a non-zero malloc
# count, because a suite whose every threshold is zero passes just as happily
# when nothing is being measured at all (`M5-05bb`).
#
# Baselines live in the git-ignored `swift/Benchmarks/Runner/.benchmarkBaselines/`:
# upstream calls that format unstable, and numbers meant to outlive a session
# belong in docs/swift/impl/perf.md with their environment beside them.

[tasks."bench:baseline:update"]
description = "Record a benchmark baseline with the environment that produced it"
run = "node {{config_root}}/tools/bench-baseline.mjs update"

[tasks."bench:baseline:check"]
description = "Check the current run against a baseline recorded in this environment"
run = "node {{config_root}}/tools/bench-baseline.mjs check"

# Committed static thresholds are the portable CI gate. Each p90 reference is
# zero and benchmark source supplies its one-sided absolute ceiling; the tool
# first proves malloc counting is live and that every gated benchmark and file
# exists.
# The sentinel command runs one real workload against a temporary impossible
# reference and succeeds only when the harness rejects it as a regression.

[tasks."bench:thresholds:check"]
description = "Check exact allocation and PERF-10 p90 ceilings"
run = "node {{config_root}}/tools/bench-baseline.mjs thresholds-check"

[tasks."bench:thresholds:sentinel"]
description = "Prove the absolute benchmark threshold gate rejects a regression"
run = "node {{config_root}}/tools/bench-baseline.mjs thresholds-sentinel"

# The published documentation site has two halves that are built by different
# toolchains and merged into one GitHub Pages deployment.
#
# `docs:api` is the DocC archive — the generated reference for the shipping
# Swift library. `docs:build` is the VitePress site over `docs/`, which is
# where the design and implementation record lives. `docs` runs both and
# assembles them; see `tools/assemble-docs-site.mjs` for why one deployment has
# to contain both.
#
# swift-docc-plugin is env-gated behind `COG_DOCC=1` so that an ordinary
# consumer resolves this package with no dependencies at all; that gate is
# exactly why the DocC build needs a task of its own rather than a remembered
# incantation.
#
# Three details are not optional. `--hosting-base-path cog` is what makes the
# archive work under `skeswa.github.io/cog/` instead of a root domain, and the
# VitePress `base` has to agree with it. The resolve writes a `Package.resolved`
# carrying the plugin's pins next to `Package.swift`, which must never be
# committed — the task deletes it, and `docs.yml` fails the build if one
# survives anyway.
#
# And `--experimental-transform-for-static-hosting-with-content` is what gives
# each page an identity. Without it every one of the ~250 route files is a
# byte-identical single-page-app shell titled "Documentation", so anything that
# does not run JavaScript — a search crawler, a link unfurl in Slack or
# Messages, a reader with scripting off — sees nothing at all, while the
# VitePress half of the same site has real titles and real text. With it each
# file carries its own `<title>`, a `<meta name="description">`, and the whole
# article inside `<noscript>`, and the app still hydrates over the top as
# before. This is about being readable and linkable, not about matching the
# site's appearance: DocC keeps its own look deliberately.
#
# The flag is experimental, so `tools/assemble-docs-site.mjs` asserts the
# content actually arrived rather than trusting that it did.

[tasks."docs"]
description = "Build the whole documentation site: DocC, VitePress, and the merge"
depends = ["docs:api", "docs:build"]
run = "node {{config_root}}/tools/assemble-docs-site.mjs"

[tasks."docs:api"]
description = "Build the Cog DocC archive into .build/docs"
run = """
set -euo pipefail
rm -rf "{{config_root}}/.build/docs"
mkdir -p "{{config_root}}/.build/docs"
COG_DOCC=1 swift package \
  --package-path "{{config_root}}" \
  --scratch-path "{{config_root}}/.build/docc" \
  --allow-writing-to-directory "{{config_root}}/.build/docs" \
  generate-documentation \
  --target Cog \
  --disable-indexing \
  --transform-for-static-hosting \
  --experimental-transform-for-static-hosting-with-content \
  --hosting-base-path cog \
  --output-path "{{config_root}}/.build/docs/Cog.doccarchive"
rm -f "{{config_root}}/Package.resolved"
"""

# The VitePress half. These shell out to the locally installed `vitepress`
# binary rather than through an npm script, matching how every other task here
# invokes its tool directly. `npm ci` must have run first; the site is the only
# thing in this repository with a dependency tree.

[tasks."docs:build"]
description = "Build the VitePress documentation site from docs/"
run = "{{config_root}}/node_modules/.bin/vitepress build {{config_root}}/docs"

[tasks."docs:dev"]
description = "Serve the VitePress documentation site with hot reload"
run = "{{config_root}}/node_modules/.bin/vitepress dev {{config_root}}/docs"

[tasks."docs:preview"]
description = "Preview the built VitePress site without the DocC half"
run = "{{config_root}}/node_modules/.bin/vitepress preview {{config_root}}/docs"
