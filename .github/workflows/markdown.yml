name: Oxfmt

# The Oxfmt lane. Runs on GitHub-hosted ubuntu, never on the self-hosted Mac
# mini, so no same-repo fork guard is needed here. The rest of the hardening
# posture still applies and is enforced by the committed workflow-contract
# check: least-privilege permissions, only safe event triggers,
# `persist-credentials: false`, an explicit timeout, and full-SHA action pins.
#
# The filters cover every extension Oxfmt actually formats — Markdown, JSON,
# YAML, and JavaScript — not just Markdown. `tools/**` is JavaScript, so a
# checker-only change must trigger this lane or it would land unformatted
# with no CI signal at all.
#
# This job runs `fmt:check:md`, not the `fmt:check` umbrella: the umbrella
# also lints Swift, and there is no Swift toolchain on ubuntu. Swift
# formatting is gated by the `format` job in `swift-ci.yml`.

# The two path lists are deliberately duplicated rather than shared through a
# YAML anchor. GitHub Actions has supported anchors since September 2025, but
# `on:` is read by the trigger parser rather than the runner, and a parse
# failure there does not error — the lane simply never runs. Duplication is
# cheap; a silently dead formatting gate is not.
on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.mjs"
      - "**/*.js"
      - "mise.toml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.mjs"
      - "**/*.js"
      - "mise.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: oxfmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Verify formatting
        run: mise run fmt:check:md

      # The workflow-contract check lives here rather than in `swift-ci.yml`
      # because this is the repository's only GitHub-hosted lane, and the
      # filters above already cover both its inputs: the workflows themselves
      # (`**/*.yml`) and the checker (`**/*.mjs`).
      - name: Verify the workflow hardening contract
        run: mise run workflows:check
