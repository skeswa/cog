name: Conventional Commits

# The full authoring and range contract lives in
# `docs/maintainers/changes.md`.
# Revision descriptions are Release Please's version and changelog input. This
# check therefore has no path filter: every commit entering main is in scope,
# even when its files would not wake a language-specific workflow.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: conventional-commits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the authoritative range head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Install the pinned Commitlint dependency tree
        run: npm ci --ignore-scripts

      - name: Lint every revision in the GitHub event range
        run: mise run changes:check
