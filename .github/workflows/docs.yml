name: Docs

# The documentation site → GitHub Pages.
#
# The site has two halves built by two toolchains. `docs/` is a VitePress site
# holding the design and implementation record; the DocC archive is the
# generated reference for the shipping Swift library. GitHub Pages serves one
# deployment per repository and `actions/deploy-pages` replaces it wholesale,
# so the halves are merged into a single artifact by
# `tools/assemble-docs-site.mjs` and published together. Its header explains
# why the overlay is safe.
#
# Four jobs, split by what each one needs:
#
#   `docc-cache` runs on GitHub-hosted ubuntu and only asks whether a DocC
#   archive for the current release is already cached. It exists so an ordinary
#   documentation change does not wake the Mac mini at all.
#
#   `docc` runs on macOS, and only on a cache miss. The DocC archive needs a
#   full Xcode — `Cog` imports SwiftUI and Observation, so there is no Linux
#   build of this package — and the same pinned toolchain the rest of CI uses.
#   Its home is the self-hosted Mac mini; while the mini is unavailable it
#   rides GitHub-hosted `macos-26` (see `docs/maintainers/ci.md`). It documents
#   the release tag's sources with this ref's `docs:api` recipe, so a change to
#   how the archive is built reaches the site without waiting for a release.
#
#   `assemble` runs on GitHub-hosted ubuntu. It installs npm dependencies,
#   builds the VitePress half, merges in the DocC half, and uploads the Pages
#   artifact. It holds a read-only token: this is the job that executes third-
#   party install scripts, so it is deliberately the job with nothing to grant.
#
#   `deploy` runs on GitHub-hosted ubuntu and does nothing but publish that
#   artifact. It is the one job in this repository with a write scope, and it is
#   hosted precisely so a `pages: write` / `id-token: write` token never lands
#   on the persistent runner. `tools/check-workflows.mjs` names this exact file,
#   job, and pair of scopes in `PERMISSION_EXCEPTIONS`, so the grant is reviewed
#   policy rather than a hole in the check.
#
# DocC and the VitePress site's current-version references always use GitHub's
# newest published release, never `main`, so a draft tag or a source checkout
# cannot leak an unreleased or stale version into Pages. That guarantee dates
# to the first tagged release and survives here.
#
# The `push` trigger deliberately has no `paths:` filter. GitHub applies path
# filters to tag pushes as well as branch pushes, and a release tag usually
# points at a commit whose diff touches nothing under `docs/` — the filter would
# silently skip the release publish, which is the one run that must never be
# skipped. Publishing is idempotent and cheap, so running on every push to
# `main` is the safer trade.
#
# `pull_request` is filtered, and that is not a contradiction: no tag arrives by
# pull request, so the trap above cannot fire there. This lane exists because
# nothing else checks the site before it merges. Swift CI builds the whole site
# too, but only under `candidate-extras`, which is dispatch-only and gates a
# release — so until this trigger existed, a docs change first met a site build
# after it was already on `main`. A dead link, a `check-getting-started.mjs`
# mismatch, or a missing merge route reddened `main` rather than the pull
# request that introduced it. On a pull request every job below runs exactly as
# it does on `main` except `deploy`, which has nothing to publish to.
on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "docs/**"
      - "swift/Sources/Cog/Cog.docc/**"
      - "package.json"
      - "package-lock.json"
      - "mise.toml"
      - "tools/assemble-docs-site.mjs"
      - "tools/build-cog-mark.mjs"
      - "tools/check-docs-social-metadata.mjs"
      - "tools/check-getting-started.mjs"
      - "tools/build-cog-skill.mjs"
      - "skills/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Keyed on the Pages deployment rather than on the ref, because that is the
# resource two concurrent runs would actually fight over. Never cancel in
# progress: a half-replaced Pages deployment is worse than a slow one.
#
# Pull requests deploy nothing, so they contend for nothing. Putting them in the
# `pages` group would make one open pull request delay a release publish for no
# reason, so they group per ref and supersede themselves instead — the ordinary
# treatment for a check whose only consumer is the pull request it is reporting
# on.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Kept in step with `swift-ci.yml`. Changing one without the other means the
  # documentation describes a build nobody tested.
  COG_XCODE_VERSION: "26.6"
  COG_XCODE_BUILD: "17F113"
  COG_MISE_VERSION: "2026.8.3"

jobs:
  docc-cache:
    name: Look for a cached DocC archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      key: ${{ steps.release.outputs.key }}
      hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are how the DocC half is pinned, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release the API reference should describe
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"; then
            echo "::error title=No published release::The documentation site is built from GitHub's newest published release, and the API did not return one."
            exit 1
          fi
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tag" || \
             ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "::error title=Invalid published release::GitHub's latest release names ${tag}, which is not a checked-out bare semantic-version tag."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # The trailing `-vN` names the recipe. The tag and Xcode pin the
          # sources and toolchain, but the flags `docs:api` passes are part of
          # what gets cached too, so bump it whenever those flags change:
          # v2 added DocC's Markdown twins and their manifest.
          echo "key=docc-${tag}-xcode${COG_XCODE_VERSION}-${COG_XCODE_BUILD}-v2" >> "$GITHUB_OUTPUT"
          echo "Building the API reference from ${tag}."

      - name: Ask whether that archive is already cached
        id: probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/docs
          key: ${{ steps.release.outputs.key }}
          lookup-only: true

  docc:
    name: Build the DocC archive (GitHub-hosted)
    needs: docc-cache
    # Only on a miss. A cache entry is scoped to the ref that created it, so the
    # first run on `main` after a release will miss and rebuild once; every
    # documentation push after that hits and skips this job entirely.
    #
    # The same-repo clause keeps a fork's pull request from spending half an
    # hour of macOS on a cold cache, and it is also the trust boundary: the
    # `docs:api` recipe below comes from the pull request's head, and only the
    # documented sources come from the release tag. A fork that does hit a cold
    # cache fails in `assemble` with the explicit message below, which is the
    # honest outcome.
    if: >-
      github.repository == 'skeswa/cog' && needs.docc-cache.outputs.hit != 'true'
      && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Two checkouts. The first is this ref: `mise.toml`, whose `docs:api`
      # task is the recipe, and `tools/select-xcode.mjs`. The second is the
      # release the archive documents, placed under `.build/` so it is the
      # package DocC reads and nothing else.
      - name: Check out the repository for the docs recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the release the archive documents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.docc-cache.outputs.tag }}
          path: .build/docs-source
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Build the DocC archive
        env:
          COG_DOCS_PACKAGE_PATH: ${{ github.workspace }}/.build/docs-source
        run: mise run docs:api

      # `Package.resolved` exists only because `COG_DOCC=1` pulled in
      # swift-docc-plugin. Consumers must resolve this package with no
      # dependencies at all, so the file never leaves this job — and a
      # surviving copy would be a real defect, not a tidiness issue. Both
      # checkouts are checked: the resolve writes beside the package it
      # resolved, and a task edit that pointed it at the wrong one would
      # otherwise pass here.
      - name: Prove the docs build left no dependency pins behind
        run: |
          set -euo pipefail
          for pins in Package.resolved .build/docs-source/Package.resolved; do
            if [ -e "$pins" ]; then
              echo "::error title=Package.resolved survived::The docs build left dependency pins at ${pins}. mise run docs:api must delete it."
              exit 1
            fi
          done

      - name: Cache the archive for later documentation pushes
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/docs
          key: ${{ needs.docc-cache.outputs.key }}

  assemble:
    name: Build and assemble the site
    needs: [docc-cache, docc]
    # `docc` is skipped on a cache hit, and a skipped dependency would otherwise
    # skip this job too. Guard on the jobs that must not have *failed* instead.
    if: always() && needs.docc-cache.result == 'success' && needs.docc.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # VitePress reads each page's last-updated timestamp from git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Restore the DocC archive
        id: docc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/docs
          key: ${{ needs.docc-cache.outputs.key }}

      # The merge script fails on a missing archive anyway. This says why first,
      # because "no DocC archive" is a cache problem with a known remedy rather
      # than a defect in the site.
      - name: Require the DocC archive
        if: steps.docc.outputs.cache-hit != 'true'
        run: |
          echo "::error title=No DocC archive::The archive for ${{ needs.docc-cache.outputs.tag }} was neither cached nor rebuilt. Re-run this workflow to rebuild it on the macOS runner."
          exit 1

      - name: Cache npm downloads and the VitePress build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            docs/.vitepress/cache
          key: docs-site-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('docs/**/*.md') }}
          restore-keys: |
            docs-site-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            docs-site-${{ runner.os }}-

      - name: Install the documentation site's dependencies
        run: npm ci

      - name: Build the VitePress site
        env:
          COG_DOCS_RELEASE_VERSION: ${{ needs.docc-cache.outputs.tag }}
        run: mise run docs:build

      - name: Assemble both halves into one site
        run: node tools/assemble-docs-site.mjs

      # Everything above this line is the check: the site built, both halves
      # merged, and `assemble-docs-site.mjs` satisfied that the required routes
      # arrived. Only the upload is deployment machinery, so only the upload is
      # skipped on a pull request.
      - name: Package the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/docs-site

  deploy:
    name: Publish to GitHub Pages
    needs: assemble
    # `always()` for the same reason `assemble` needs it, one step further down.
    # A skipped job skips everything that needs it, and that propagates through
    # the whole `needs` ancestry rather than stopping at the job that recovered:
    # `assemble` survives a skipped `docc` on its own guard, but the default
    # `success()` here still sees the skip two levels up and takes this job with
    # it. That is not a hypothetical — every documentation push between 0.6.0
    # and 0.6.1 hit the DocC cache, skipped `docc`, built and uploaded a Pages
    # artifact, and then silently published none of it, because a skipped job
    # leaves the run green. Guard on `assemble` alone, which is the only result
    # that decides whether there is an artifact worth deploying.
    # A pull request has no artifact to publish and no business replacing the
    # live site, so it never reaches this job.
    if: >-
      always() && needs.assemble.result == 'success' && github.event_name !=
      'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The repository's one write grant. See the header, and
    # `PERMISSION_EXCEPTIONS` in `tools/lib/workflows/checks.mjs`.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
