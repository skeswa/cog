name: Swift CI

# The Swift lane. Everything here needs a Swift toolchain, so every job runs on
# macOS — and ordinary CI means one of exactly two runner lanes:
#
#   1. The self-hosted Mac mini, `runs-on: [self-hosted, macOS, ARM64,
#      cog-mini]`, for pushes to `main` and same-repo pull requests.
#   2. An approval-gated GitHub-hosted `macos-26` runner, for pull requests
#      from forks, which structurally never reach the mini.
#
# A manually dispatched release-artifact proof adds one bounded third host:
# `macos-15-intel` downloads bytes built under pinned Xcode on the mini and
# proves SwiftPM's x86_64 executable selection without rebuilding them. Xcode
# 26.6's host tools are arm64-only, so Rosetta cannot truthfully supply that
# proof on the mini. This hosted job never runs for pull requests or pushes.
#
# The two `if:` guards below are exhaustive and mutually exclusive, so exactly
# one lane runs per event. They are copied verbatim from the "macOS runner
# topology" section of `docs/maintainers/ci.md`, which is the normative
# record; do not paraphrase them here. In particular the
# `github.event_name != 'pull_request' ||` clause is load-bearing: on `push`
# there is no `github.event.pull_request`, so a bare comparison would evaluate
# false and silently skip the self-hosted lane.
#
# The lanes are spelled out twice rather than shared through a YAML anchor or a
# computed `runs-on:`. A single job cannot carry both guards — the whole point
# of the same-repo guard is that it is absent from the fork lane — and a
# `runs-on:` that routes by event would put fork code one expression bug away
# from the mini. Duplication is cheap; that mistake is not.
#
# XCODE IS REQUIRED, and the pin is `COG_XCODE_VERSION` below. The Command
# Line Tools alone are not enough: they carry `swift` and `swift-format`, so
# building and linting work, but `swift test` fails with `no such module
# 'Testing'` because SwiftPM does not wire up the CLT copy of
# `Testing.framework`. That was proven by a real run, not assumed. Xcode is
# needed for M2's simulator lane anyway, so the pin covers both.
#
# `tools/select-xcode.mjs` selects the exact version and build through
# `DEVELOPER_DIR` rather than `sudo xcode-select`: it needs
# no privilege, so it survives the mini moving to the dedicated non-admin
# runner user the topology still targets, and it is job-scoped, so two
# concurrent jobs on the mini cannot fight over a machine-wide setting.
#
# The rest of the hardening posture is enforced by `mise run workflows:check`:
# least-privilege `permissions:`, `persist-credentials: false`, a timeout on
# every job, no `pull_request_target`, and full-SHA action pins.
#
# The job list grew alongside the library: the release-configuration and
# compile-fail jobs, then `test-simulator` and the example-app builds, then the
# benchmark package gate, then CogLint dogfood on both macOS runner lanes, and
# finally the manually dispatched, exact-source release-artifact job.

# The two path lists are deliberately duplicated rather than shared through a
# YAML anchor, for the reason `markdown.yml` records: `on:` is read by the
# trigger parser rather than the runner, and a parse failure there does not
# error — the lane simply never runs.
on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Release Please pull request number whose exact tree is being tested
        required: true
        type: string
      recovery_tag:
        description: Existing immutable release tag to rebuild after a publication failure
        required: false
        type: string
  pull_request:
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "swift/**"
      - ".swift-format"
      - "mise.toml"
      - "tools/**"
      - "docs/swift/impl/scenarios.md"
      - ".github/workflows/swift-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "swift/**"
      - ".swift-format"
      - "mise.toml"
      - "tools/**"
      - "docs/swift/impl/scenarios.md"
      - ".github/workflows/swift-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # THE XCODE PIN. One line, every job. 26.6 is build 17F113 on the mini and
  # build 17F113 on the GitHub-hosted `macos-26` image, where it is also the
  # default — so the two lanes compile with the identical toolchain, not
  # merely the same version number.
  COG_XCODE_VERSION: "26.6"
  COG_XCODE_BUILD: "17F113"
  # The final Intel-hosted Xcode release carries Swift tools 6.2, matching the
  # generated CogLintPlugins manifest. `macos-15-intel` defaults to Xcode 16.4
  # / Swift 6.1, so the downloaded-byte consumer selects this pin explicitly.
  COG_INTEL_XCODE_VERSION: "26.3"
  COG_INTEL_XCODE_BUILD: "17C529"
  # Kept in step with `markdown.yml`.
  COG_MISE_VERSION: "2026.8.3"

jobs:
  # ---------------------------------------------------------------------------
  # Self-hosted lane: pushes to `main` and same-repo pull requests.
  # ---------------------------------------------------------------------------

  # Release Please PRs are created with the repository token, so GitHub does
  # not emit their ordinary pull-request workflow events. The exact-head
  # candidate dispatch supplies the same required check context explicitly;
  # ordinary contributor PRs and pushes continue to use the dedicated
  # `conventional-commits.yml` workflow.
  candidate-changes:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    if: github.repository == 'skeswa/cog' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out the exact candidate source and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Install the pinned Commitlint dependency tree
        run: npm ci --ignore-scripts

      - name: Lint the candidate's complete revision range
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_PR" in
            ''|*[!0-9]*) echo "::error title=Invalid release PR::release_pr must be a pull request number"; exit 1 ;;
          esac
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          base_sha="$(jq -r .base.sha <<<"$pr")"
          head_sha="$(jq -r .head.sha <<<"$pr")"
          if [ -n "$RECOVERY_TAG" ]; then
            head_sha="$GITHUB_SHA"
            base_sha="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          mise run changes:check -- --git "$base_sha" "$head_sha"

  format:
    name: Format (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 15
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      # `fmt:check:swift`, not the `fmt:check` umbrella: the umbrella also runs
      # Oxfmt over Markdown, JSON, and YAML, which `markdown.yml` already gates
      # on GitHub-hosted ubuntu. Splitting them keeps each failure in the lane
      # that can explain it.
      - name: Lint Swift formatting
        run: mise run fmt:check:swift

  lint-swift:
    name: CogLint dogfood (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 20
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Lint Cog and example apps with CogLint
        run: mise run lint:swift

  # Release-candidate bytes are deliberately manual. A dispatch still runs the
  # full same-repo suite, but only this job pays for both native release builds,
  # proves the arm64 member, and retains their exact archive. It checks out
  # `github.sha`, not a PR merge commit, so the later tag can name the source
  # recorded in provenance. The dependent Intel job consumes these same bytes.
  lint-artifact:
    name: CogLint candidate artifact (self-hosted)
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      pr_head_sha: ${{ steps.candidate.outputs.pr_head_sha }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      source_tree: ${{ steps.candidate.outputs.source_tree }}
      mode: ${{ steps.candidate.outputs.mode }}
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    if: >-
      github.repository == 'skeswa/cog' && github.event_name ==
      'workflow_dispatch' && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind the dispatch to the release PR or immutable recovery tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_PR" in
            ''|*[!0-9]*) echo "::error title=Invalid release PR::release_pr must be a pull request number"; exit 1 ;;
          esac

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          base="$(jq -r .base.ref <<<"$pr")"
          head_repo="$(jq -r .head.repo.full_name <<<"$pr")"
          head_ref="$(jq -r .head.ref <<<"$pr")"
          pr_head_sha="$(jq -r .head.sha <<<"$pr")"
          pr_head_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${pr_head_sha}" --jq .tree.sha)"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          version="$(tr -d '[:space:]' < version.txt)"

          if [ "$base" != main ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Invalid release PR::PR #${RELEASE_PR} must target main from this repository"
            exit 1
          fi
          case "$head_ref" in
            release-please--branches--main*) ;;
            *) echo "::error title=Invalid release PR::PR #${RELEASE_PR} is not a Release Please branch"; exit 1 ;;
          esac

          if [ -n "$RECOVERY_TAG" ]; then
            if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "$RECOVERY_TAG" ]; then
              echo "::error title=Recovery ref mismatch::dispatch recovery at the exact ${RECOVERY_TAG} tag"
              exit 1
            fi
            tag_sha="$(git rev-list -n 1 "$RECOVERY_TAG")"
            if [ "$source_sha" != "$tag_sha" ] || [ "$version" != "$RECOVERY_TAG" ]; then
              echo "::error title=Recovery source mismatch::tag, checkout, and version.txt must identify the same release"
              exit 1
            fi
            mode=recovery
          else
            if [ "$source_sha" != "$pr_head_sha" ] || [ "$GITHUB_SHA" != "$pr_head_sha" ]; then
              echo "::error title=Candidate ref mismatch::dispatch the workflow at PR #${RELEASE_PR}'s current head ${pr_head_sha}"
              exit 1
            fi
            mode=candidate
          fi

          if [ "$source_tree" != "$pr_head_tree" ]; then
            echo "::error title=Candidate tree mismatch::release PR and dispatched source trees differ"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid candidate version::version.txt contains ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=${pr_head_sha}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "source_tree=${source_tree}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Build the artifact and exercise its arm64 variant
        run: mise run test:lint-artifact -- --host arm64

      - name: Verify and record candidate provenance
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          PR_HEAD_SHA: ${{ steps.candidate.outputs.pr_head_sha }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.candidate.outputs.source_tree }}
          MODE: ${{ steps.candidate.outputs.mode }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          set -euo pipefail
          archive="swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip"
          checksum_file="${archive}.checksum"
          provenance="${archive}.provenance.json"

          source_sha="$(git rev-parse HEAD)"
          if [ "$source_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Candidate source mismatch::checked out ${source_sha}, expected ${SOURCE_SHA}"
            exit 1
          fi

          xcode_version="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          xcode_build="$(xcodebuild -version | sed -n 's/^Build version //p')"
          swift_version="$(swift --version | head -n 1)"
          if [ "$xcode_version" != "$COG_XCODE_VERSION" ] || [ "$xcode_build" != "$COG_XCODE_BUILD" ]; then
            echo "::error title=Candidate toolchain mismatch::expected Xcode ${COG_XCODE_VERSION} (${COG_XCODE_BUILD}), got ${xcode_version} (${xcode_build})"
            exit 1
          fi
          case "$swift_version" in
            *"Apple Swift version 6.3.3"*) ;;
            *) echo "::error title=Candidate Swift mismatch::${swift_version}"; exit 1 ;;
          esac

          recorded_checksum="$(tr -d '[:space:]' < "$checksum_file")"
          computed_checksum="$(swift package compute-checksum "$archive")"
          if [ "$recorded_checksum" != "$computed_checksum" ]; then
            echo "::error title=Candidate checksum mismatch::recorded ${recorded_checksum}, computed ${computed_checksum}"
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --argjson release_pr "$RELEASE_PR" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --arg mode "$MODE" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg artifact "$(basename "$archive")" \
            --arg checksum "$computed_checksum" \
            --arg xcode_version "$xcode_version" \
            --arg xcode_build "$xcode_build" \
            --arg swift_version "$swift_version" \
            '{
              format: "coglint-candidate-v2",
              version: $version,
              release_pr: $release_pr,
              pr_head_sha: $pr_head_sha,
              source_sha: $source_sha,
              source_tree: $source_tree,
              mode: $mode,
              workflow: $workflow,
              workflow_run_id: ($run_id | tonumber),
              artifact: $artifact,
              checksum: $checksum,
              architectures: ["arm64", "x86_64"],
              build: {
                runner: "self-hosted-cog-mini",
                xcode_version: $xcode_version,
                xcode_build: $xcode_build,
                swift_version: $swift_version,
                arm64_probe: "passed"
              },
              intel: null
            }' > "$provenance"
          jq . "$provenance"

      - name: Hand the exact candidate bytes to the Intel verifier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coglint-build-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.pr_head_sha }}
          path: |
            swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip
            swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip.checksum
            swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip.provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Xcode 26.6 builds the Intel executable but ships an arm64-only SwiftPM
  # driver, so Rosetta cannot prove host selection on the mini. This dependent
  # job downloads the already-checksummed candidate onto GitHub's real Intel
  # host and exercises that exact archive without rebuilding any CogLint code.
  lint-artifact-x86_64:
    name: CogLint candidate artifact (Intel host)
    needs: lint-artifact
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && github.event_name ==
      'workflow_dispatch' && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Intel consumer Xcode
        run: |
          set -euo pipefail
          found=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version="$(/usr/bin/defaults read "$app/Contents/version" CFBundleShortVersionString 2>/dev/null || echo unknown)"
            if [ "$version" = "$COG_INTEL_XCODE_VERSION" ] && [ -z "$found" ]; then
              found="$app"
            fi
          done
          if [ -z "$found" ]; then
            echo "::error title=Intel Xcode missing::Xcode ${COG_INTEL_XCODE_VERSION} is not installed"
            exit 1
          fi
          developer_dir="${found}/Contents/Developer"
          actual_build="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | sed -n 's/^Build version //p')"
          if [ "$actual_build" != "$COG_INTEL_XCODE_BUILD" ]; then
            echo "::error title=Intel Xcode build mismatch::expected ${COG_INTEL_XCODE_BUILD}, got ${actual_build}"
            exit 1
          fi
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" swift --version
          file "$(DEVELOPER_DIR="$developer_dir" xcrun --find swift)"

      - name: Download the exact arm-built candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coglint-build-${{ needs.lint-artifact.outputs.version }}-${{ needs.lint-artifact.outputs.pr_head_sha }}
          path: swift/Lint/Artifacts

      - name: Verify the Intel host and downloaded provenance
        env:
          VERSION: ${{ needs.lint-artifact.outputs.version }}
          PR_HEAD_SHA: ${{ needs.lint-artifact.outputs.pr_head_sha }}
          SOURCE_SHA: ${{ needs.lint-artifact.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.lint-artifact.outputs.source_tree }}
          MODE: ${{ needs.lint-artifact.outputs.mode }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          set -euo pipefail
          archive="swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip"
          checksum_file="${archive}.checksum"
          provenance="${archive}.provenance.json"

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error title=Candidate host mismatch::expected x86_64, got $(uname -m)"
            exit 1
          fi
          jq -e \
            --arg version "$VERSION" \
            --argjson release_pr "$RELEASE_PR" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --arg mode "$MODE" \
            '.format == "coglint-candidate-v2" and
             .version == $version and
             .release_pr == $release_pr and
             .pr_head_sha == $pr_head_sha and
             .source_sha == $source_sha and
             .source_tree == $source_tree and
             .mode == $mode and
             .architectures == ["arm64", "x86_64"] and
             .build.xcode_version == env.COG_XCODE_VERSION and
             .build.xcode_build == env.COG_XCODE_BUILD and
             .build.arm64_probe == "passed"' "$provenance"
          recorded_checksum="$(tr -d '[:space:]' < "$checksum_file")"
          computed_checksum="$(swift package compute-checksum "$archive")"
          jq -e --arg checksum "$computed_checksum" '.checksum == $checksum' "$provenance"
          if [ "$recorded_checksum" != "$computed_checksum" ]; then
            echo "::error title=Downloaded checksum mismatch::recorded ${recorded_checksum}, computed ${computed_checksum}"
            exit 1
          fi
          xcodebuild -version
          swift --version
          cat "$provenance"

      - name: Exercise the exact x86_64 artifact variant
        run: mise run test:lint-artifact -- --from-archive --host x86_64

      - name: Finalize and retain publication provenance
        env:
          VERSION: ${{ needs.lint-artifact.outputs.version }}
          PR_HEAD_SHA: ${{ needs.lint-artifact.outputs.pr_head_sha }}
        run: |
          set -euo pipefail
          provenance="swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip.provenance.json"
          xcode_version="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          xcode_build="$(xcodebuild -version | sed -n 's/^Build version //p')"
          swift_version="$(swift --version | head -n 1)"
          jq \
            --arg runner "macos-15-intel" \
            --arg xcode_version "$xcode_version" \
            --arg xcode_build "$xcode_build" \
            --arg swift_version "$swift_version" \
            '.intel = {
              runner: $runner,
              architecture: "x86_64",
              xcode_version: $xcode_version,
              xcode_build: $xcode_build,
              swift_version: $swift_version,
              x86_64_probe: "passed"
            }' "$provenance" > "${provenance}.tmp"
          mv "${provenance}.tmp" "$provenance"
          jq -e '.intel.x86_64_probe == "passed"' "$provenance"

      - name: Retain the publication-ready archive and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coglint-candidate-${{ needs.lint-artifact.outputs.version }}-${{ needs.lint-artifact.outputs.pr_head_sha }}
          path: |
            swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip
            swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip.checksum
            swift/Lint/Artifacts/CogLintBinary.artifactbundle.zip.provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  candidate-extras:
    name: Release-only integration and documentation (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 90
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && github.event_name ==
      'workflow_dispatch' && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Install the documentation dependency tree
        run: npm ci --ignore-scripts

      - name: Verify all source and document formatting
        run: mise run fmt:check

      - name: Prove both CogLint plugin surfaces
        run: |
          mise run test:lint-build-tool-plugin
          mise run test:lint-command-plugin
          mise run test:lint-distribution
          mise run test:lint-documentation

      - name: Build the complete documentation site
        run: mise run docs

      - name: Run the Storefront UI macrobenchmark
        run: mise run test:storefront-ui

  test-host:
    name: Host tests (self-hosted, ${{ matrix.leg }})
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 45
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      # One leg's failure is not the other three legs' failure, and the whole
      # point of the matrix is to learn which legs disagree.
      fail-fast: false
      matrix:
        # The four legs of the isolation matrix, named exactly as
        # `tools/swift-test.mjs` names them — the wrapper takes each leg name
        # as a mode of its own. Each leg gets its own job so the legs
        # parallelize across the mini's runners and cache separately.
        leg:
          - mainactor-nnbd-on
          - mainactor-nnbd-off
          - nonisolated-nnbd-on
          - nonisolated-nnbd-off
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      # The cached directory is the leg's SwiftPM scratch path, which
      # `tools/swift-test.mjs` derives as `.build/<leg>-<configuration>`. Trait
      # and package-trait variants add `-package-<fingerprint>` so they cannot
      # invalidate that shipping-default directory.
      #
      # The key covers the manifest, the resolved dependency graph, and the
      # pinned tooling. It deliberately does not name a compiler: nothing here
      # pins one, and SwiftPM already stamps the scratch path with a
      # `swift-version-*.txt` and rebuilds when the compiler changes, so a
      # cache restored across a toolchain upgrade is slow, never wrong.
      - name: Restore the leg's build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/${{ matrix.leg }}-debug
            .build/${{ matrix.leg }}-debug-package-*
          key: swift-${{ matrix.leg }}-debug-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved', 'mise.toml') }}
          restore-keys: |
            swift-${{ matrix.leg }}-debug-${{ runner.arch }}-

      - name: Run the host tests for this leg
        env:
          COG_TEST_LEG: ${{ matrix.leg }}
        run: mise exec -- node tools/swift-test.mjs "$COG_TEST_LEG" --no-parallel

      - name: Test the CompactArena public trait
        if: matrix.leg == 'mainactor-nnbd-on'
        run: mise run test:arena-configurations

  test-simulator:
    name: Simulator boundary tests (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 45
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Run the simulator boundary tests
        run: mise run test:simulator

  build-weather:
    name: Example apps and macrobenchmark workload (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 30
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Build the Weather example
        run: mise run build:weather

      - name: Run the Weather example tests
        run: mise run test:weather

      - name: Build the TodoMVC example
        run: mise run build:todomvc

      - name: Run the TodoMVC example tests
        run: mise run test:todomvc

      # The Storefront macrobenchmark's shared workload and its SwiftUI
      # benchmark application. The workload's correctness suite is the gate
      # every recorded Storefront number rests on, so it runs on every change.
      #
      # The release UI *performance* suite is deliberately not here. It is
      # report-only, it is slow, and a timing test on a shared machine teaches
      # people to rerun rather than to look; it runs from
      # `mise run test:storefront-ui` when a number is wanted.
      # `test:storefront-all` rather than `test:storefront`: the workload, Cog,
      # both comparison-runtime packages, and cross-runtime agreement suites.
      # A comparison is only meaningful when every runtime in it is green in the
      # same revision, and the agreement suite is what proves the four computed
      # the same answers — without it a fast number might just be a wrong one.
      - name: Run the Storefront workload and comparison-runtime tests
        run: mise run test:storefront-all

      - name: Build the Storefront benchmark app
        run: mise run build:storefront

  # The release-configuration leg. The guardrails that promise every-build
  # behaviour — the second-context guard, escaped writers, cycle detection, the
  # absence of `seed`, and free debug history — only mean something if they are
  # proven outside debug. Runs the default leg only; the isolation matrix is a
  # debug-side concern.
  test-release:
    name: Release tests (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 45
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Restore the release build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/mainactor-nnbd-on-release
          key: swift-mainactor-nnbd-on-release-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved', 'mise.toml') }}
          restore-keys: |
            swift-mainactor-nnbd-on-release-${{ runner.arch }}-

      - name: Run the release-configuration tests
        run: mise run test:release

      - name: Check the supported public APIs against the latest release
        run: mise run api:check

  # The compile-fail fixtures, type-checked in one batched `swiftc` pass. Its
  # own scratch path, so it never contends with the test legs' caches.
  compile-fail:
    name: Compile-fail fixtures (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 20
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Type-check the compile-fail fixtures
        run: mise run test:compilefail

  # ---------------------------------------------------------------------------
  # Fork lane: pull requests from forks, on GitHub-hosted macOS.
  #
  # These jobs are the fork's entire macOS signal, so they mirror the
  # self-hosted lane above step for step, including the same pinned Xcode.
  # Pinning in one lane only would mean the two lanes prove different things.
  # `macos-26` ships several Xcodes and defaults to a newer one, so the pin is
  # doing real work here, not just documenting.
  #
  # These jobs need no same-repo guard because they carry its complement, and
  # they are approval-gated by the repository's `all_external_contributors`
  # fork-PR policy, not by anything in this file.
  # ---------------------------------------------------------------------------

  fork-format:
    name: Format (fork, GitHub-hosted)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Lint Swift formatting
        run: mise run fmt:check:swift

  fork-lint-swift:
    name: CogLint dogfood (fork, GitHub-hosted)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Lint Cog and example apps with CogLint
        run: mise run lint:swift

  fork-test-host:
    name: Host tests (fork, GitHub-hosted, ${{ matrix.leg }})
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        leg:
          - mainactor-nnbd-on
          - mainactor-nnbd-off
          - nonisolated-nnbd-on
          - nonisolated-nnbd-off
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      # Keyed apart from the self-hosted lane's caches: same leg, different
      # host, different toolchain.
      - name: Restore the leg's build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/${{ matrix.leg }}-debug
            .build/${{ matrix.leg }}-debug-package-*
          key: swift-fork-${{ matrix.leg }}-debug-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved', 'mise.toml') }}
          restore-keys: |
            swift-fork-${{ matrix.leg }}-debug-${{ runner.arch }}-

      - name: Run the host tests for this leg
        env:
          COG_TEST_LEG: ${{ matrix.leg }}
        run: mise exec -- node tools/swift-test.mjs "$COG_TEST_LEG" --no-parallel

      - name: Test the CompactArena public trait
        if: matrix.leg == 'mainactor-nnbd-on'
        run: mise run test:arena-configurations

      - name: Check the supported public APIs against the latest release
        if: matrix.leg == 'mainactor-nnbd-on'
        run: mise run api:check

  fork-test-simulator:
    name: Simulator boundary tests (fork, GitHub-hosted)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Run the simulator boundary tests
        run: mise run test:simulator

  fork-build-weather:
    name: Example apps and macrobenchmark workload (fork, GitHub-hosted)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Build the Weather example
        run: mise run build:weather

      - name: Run the Weather example tests
        run: mise run test:weather

      - name: Build the TodoMVC example
        run: mise run build:todomvc

      - name: Run the TodoMVC example tests
        run: mise run test:todomvc

      # The Storefront macrobenchmark's shared workload and its SwiftUI
      # benchmark application. The workload's correctness suite is the gate
      # every recorded Storefront number rests on, so it runs on every change.
      #
      # The release UI *performance* suite is deliberately not here. It is
      # report-only, it is slow, and a timing test on a shared machine teaches
      # people to rerun rather than to look; it runs from
      # `mise run test:storefront-ui` when a number is wanted.
      # `test:storefront-all` rather than `test:storefront`: the workload, Cog,
      # both comparison-runtime packages, and cross-runtime agreement suites.
      # A comparison is only meaningful when every runtime in it is green in the
      # same revision, and the agreement suite is what proves the four computed
      # the same answers — without it a fast number might just be a wrong one.
      - name: Run the Storefront workload and comparison-runtime tests
        run: mise run test:storefront-all

      - name: Build the Storefront benchmark app
        run: mise run build:storefront

  # The benchmark package's portable gate. PERF-10 wall-clock measurements use
  # generous absolute p90 ceilings recorded from the pinned comparison, while
  # PERF-06 retains its exact zero-malloc requirement. The wrapper first proves
  # malloc counting is live and that every gated benchmark and threshold exists.
  #
  # This stays on the bare Apple Silicon mini: timing ceilings are meaningful
  # only on the pinned environment. The host services one job at a time, and
  # the repository-wide concurrency group also prevents benchmark runs from
  # different refs contending if another matching runner is ever added.
  bench-build:
    name: Benchmark thresholds (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: swift-bench-cog-mini
      cancel-in-progress: false
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: node tools/select-xcode.mjs

      - name: Restore the benchmark build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: swift/Benchmarks/Runner/.build
          key: swift-bench-${{ runner.arch }}-${{ hashFiles('swift/Benchmarks/Runner/Package.swift', 'swift/Benchmarks/Runner/Package.resolved') }}
          restore-keys: |
            swift-bench-${{ runner.arch }}-

      - name: Check exact allocation and PERF-10 p90 ceilings
        run: mise run bench:thresholds:check

  candidate-gate:
    name: Release candidate
    needs:
      - candidate-changes
      - format
      - lint-swift
      - lint-artifact-x86_64
      - candidate-extras
      - test-host
      - test-simulator
      - build-weather
      - test-release
      - compile-fail
      - bench-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.repository == 'skeswa/cog' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Record the complete exact-source candidate gate
        env:
          RELEASE_PR: ${{ inputs.release_pr }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          echo "Release PR #${RELEASE_PR} passed the complete candidate workflow at ${GITHUB_SHA}."
          if [ -n "$RECOVERY_TAG" ]; then
            echo "Recovery rebuild is bound to immutable tag ${RECOVERY_TAG}."
          fi
