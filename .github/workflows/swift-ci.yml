        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Validate the task ledger against the plan and scenarios
        run: mise run tasks:check

