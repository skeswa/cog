  # ---------------------------------------------------------------------------
  # Document lane: the plan-to-task contract, on GitHub-hosted ubuntu.
  #
  # The checker is platform-neutral Node, so it needs neither macOS nor the
  # mini, and running it on a hosted runner keeps the mini's single runner free
  # for the work that genuinely needs it. It lives in this workflow rather than
  # `markdown.yml` because the ledger is a Swift-implementation input, and the
  # path filters above are extended to match: a change to the plan, either
  # ledger, or the checker itself now triggers this workflow, so an
  # alignment-only change can never skip its validator.
