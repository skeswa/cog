            echo "::error title=Pinned Xcode missing::Xcode ${COG_XCODE_VERSION} is not installed."
            exit 1
          fi
          developer_dir="${found}/Contents/Developer"
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
