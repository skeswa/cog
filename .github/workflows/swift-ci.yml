          path: swift/Benchmarks/.build
          key: swift-bench-${{ runner.arch }}-${{ hashFiles('swift/Benchmarks/Package.swift', 'swift/Benchmarks/Package.resolved') }}
          restore-keys: |
            swift-bench-${{ runner.arch }}-

      - name: Check exact allocation and PERF-10 p90 ceilings
        run: mise run bench:thresholds:check
