name: Swift CI

# The Swift lane. Everything here needs a Swift toolchain, so every job runs on
# macOS — and macOS means one of exactly two runner lanes:
#
#   1. The self-hosted Mac mini, `runs-on: [self-hosted, macOS, ARM64,
#      cog-mini]`, for pushes to `main` and same-repo pull requests.
#   2. An approval-gated GitHub-hosted `macos-26` runner, for pull requests
#      from forks, which structurally never reach the mini.
#
# The two `if:` guards below are exhaustive and mutually exclusive, so exactly
# one lane runs per event. They are copied verbatim from the "macOS runner
# topology" section of the root README (`M0-05a`), which is the normative
# record; do not paraphrase them here. In particular the
# `github.event_name != 'pull_request' ||` clause is load-bearing: on `push`
# there is no `github.event.pull_request`, so a bare comparison would evaluate
# false and silently skip the self-hosted lane.
#
# The lanes are spelled out twice rather than shared through a YAML anchor or a
# computed `runs-on:`. A single job cannot carry both guards — the whole point
# of the same-repo guard is that it is absent from the fork lane — and a
# `runs-on:` that routes by event would put fork code one expression bug away
# from the mini. Duplication is cheap; that mistake is not.
#
# The rest of the hardening posture is enforced by `mise run workflows:check`:
# least-privilege `permissions:`, `persist-credentials: false`, a timeout on
# every job, no `pull_request_target`, and full-SHA action pins.
#
# Jobs land here as the milestones that need them land: `M0-05c` adds the
# release-configuration and compile-fail jobs, `M0-09b` adds the task-ledger
# check and widens the path filters below, M2 adds `test-simulator`, and M5
# adds `bench-build` (which must also serialize against the rest of the mini
# through its own `concurrency:` group, or its numbers carry contention noise).

# The two path lists are deliberately duplicated rather than shared through a
# YAML anchor, for the reason `markdown.yml` records: `on:` is read by the
# trigger parser rather than the runner, and a parse failure there does not
# error — the lane simply never runs.
on:
  pull_request:
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "swift/**"
      - ".swift-format"
      - "mise.toml"
      - ".github/workflows/swift-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "swift/**"
      - ".swift-format"
      - "mise.toml"
      - ".github/workflows/swift-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # THE XCODE PIN. Both macOS lanes pin the same version, which is the whole
  # reason the README picked one that exists in both: 26.5 is installed on the
  # mini and is on the GitHub-hosted `macos-26` arm64 image at
  # `/Applications/Xcode_26.5.app` (the hosted image's *default* is 26.6, so
  # this pin is doing real work there). mise cannot pin Xcode, so this is the
  # one place the version is written down in CI. `M0-13` confirms what the
  # mini actually has installed; if it differs, change this line and the
  # README's topology record together — nothing else in this file names a
  # version.
  COG_XCODE_VERSION: "26.5"
  # Kept in step with `markdown.yml`.
  COG_MISE_VERSION: "2026.8.3"

jobs:
  # ---------------------------------------------------------------------------
  # Self-hosted lane: pushes to `main` and same-repo pull requests.
  # ---------------------------------------------------------------------------

  format:
    name: Format (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 15
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      # Xcode is selected with `DEVELOPER_DIR` rather than `sudo xcode-select`.
      # `DEVELOPER_DIR` needs no privilege, so it keeps working when the mini
      # moves to the dedicated non-admin runner user the topology targets, and
      # it scopes the selection to this job, so two jobs sharing the mini can
      # never fight over a machine-wide setting. Every `xcrun`-dispatched tool
      # — `swift`, `swift format`, `xcodebuild` — honors it.
      #
      # The step prints what is actually installed and fails with that
      # inventory in the message when the pin is missing, rather than quietly
      # building against whatever version happens to be the default.
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          installed="$(ls -d /Applications/Xcode*.app 2>/dev/null || true)"
          echo "Installed Xcodes:"
          echo "${installed:-  (none)}"
          developer_dir="/Applications/Xcode_${COG_XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error title=Pinned Xcode missing::Xcode ${COG_XCODE_VERSION} is not installed on $(hostname -s). Wanted ${developer_dir}. Installed: ${installed:-(none)}"
            exit 1
          fi
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" swift --version

      # `fmt:check:swift`, not the `fmt:check` umbrella: the umbrella also runs
      # Oxfmt over Markdown, JSON, and YAML, which `markdown.yml` already gates
      # on GitHub-hosted ubuntu. Splitting them keeps each failure in the lane
      # that can explain it.
      - name: Lint Swift formatting
        run: mise run fmt:check:swift

  test-host:
    name: Host tests (self-hosted, ${{ matrix.leg }})
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 45
    permissions:
      contents: read
    if: >-
      github.repository == 'skeswa/cog' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      # One leg's failure is not the other three legs' failure, and the whole
      # point of the matrix is to learn which legs disagree.
      fail-fast: false
      matrix:
        # The four legs of the isolation matrix, named exactly as
        # `tools/swift-test.mjs` names them. Each leg gets its own job so the
        # legs parallelize across the mini's runners and cache separately.
        leg:
          - mainactor-nnbd-on
          - mainactor-nnbd-off
          - nonisolated-nnbd-on
          - nonisolated-nnbd-off
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      # Same pin, same mechanism, same failure mode as the `format` job above.
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          installed="$(ls -d /Applications/Xcode*.app 2>/dev/null || true)"
          echo "Installed Xcodes:"
          echo "${installed:-  (none)}"
          developer_dir="/Applications/Xcode_${COG_XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error title=Pinned Xcode missing::Xcode ${COG_XCODE_VERSION} is not installed on $(hostname -s). Wanted ${developer_dir}. Installed: ${installed:-(none)}"
            exit 1
          fi
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" swift --version

      # The cached directory is the leg's SwiftPM scratch path, which
      # `tools/swift-test.mjs` derives as `.build/<leg>-<configuration>`. The
      # names have to match the wrapper's exactly or the cache restores into a
      # directory nothing reads. The key covers everything that invalidates a
      # build plan: the manifest, the resolved dependency graph, the pinned
      # toolchain, and the Xcode version the objects were compiled by.
      - name: Restore the leg's build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/${{ matrix.leg }}-debug
          key: swift-${{ matrix.leg }}-debug-${{ runner.arch }}-xcode${{ env.COG_XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', 'mise.toml') }}
          restore-keys: |
            swift-${{ matrix.leg }}-debug-${{ runner.arch }}-xcode${{ env.COG_XCODE_VERSION }}-

      - name: Run the host tests for this leg
        env:
          COG_TEST_LEG: ${{ matrix.leg }}
        run: mise exec -- node tools/swift-test.mjs "$COG_TEST_LEG" --parallel

  # ---------------------------------------------------------------------------
  # Fork lane: pull requests from forks, on GitHub-hosted macOS.
  #
  # These jobs are the fork's entire macOS signal, so they mirror the
  # self-hosted lane above step for step. They need no same-repo guard because
  # they carry its complement, and they are approval-gated by the repository's
  # `all_external_contributors` fork-PR policy (`M0-14`), not by anything in
  # this file.
  # ---------------------------------------------------------------------------

  fork-format:
    name: Format (fork, GitHub-hosted)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      # Same pin, same mechanism, same failure mode as the `format` job above.
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          installed="$(ls -d /Applications/Xcode*.app 2>/dev/null || true)"
          echo "Installed Xcodes:"
          echo "${installed:-  (none)}"
          developer_dir="/Applications/Xcode_${COG_XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error title=Pinned Xcode missing::Xcode ${COG_XCODE_VERSION} is not installed on $(hostname -s). Wanted ${developer_dir}. Installed: ${installed:-(none)}"
            exit 1
          fi
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" swift --version

      - name: Lint Swift formatting
        run: mise run fmt:check:swift

  fork-test-host:
    name: Host tests (fork, GitHub-hosted, ${{ matrix.leg }})
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        leg:
          - mainactor-nnbd-on
          - mainactor-nnbd-off
          - nonisolated-nnbd-on
          - nonisolated-nnbd-off
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      # Same pin, same mechanism, same failure mode as the `format` job above.
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          installed="$(ls -d /Applications/Xcode*.app 2>/dev/null || true)"
          echo "Installed Xcodes:"
          echo "${installed:-  (none)}"
          developer_dir="/Applications/Xcode_${COG_XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error title=Pinned Xcode missing::Xcode ${COG_XCODE_VERSION} is not installed on $(hostname -s). Wanted ${developer_dir}. Installed: ${installed:-(none)}"
            exit 1
          fi
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" swift --version

      - name: Restore the leg's build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/${{ matrix.leg }}-debug
          key: swift-fork-${{ matrix.leg }}-debug-${{ runner.arch }}-xcode${{ env.COG_XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', 'mise.toml') }}
          restore-keys: |
            swift-fork-${{ matrix.leg }}-debug-${{ runner.arch }}-xcode${{ env.COG_XCODE_VERSION }}-

      - name: Run the host tests for this leg
        env:
          COG_TEST_LEG: ${{ matrix.leg }}
        run: mise exec -- node tools/swift-test.mjs "$COG_TEST_LEG" --parallel
