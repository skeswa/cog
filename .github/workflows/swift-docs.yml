name: Swift docs

# DocC → GitHub Pages.
#
# Two jobs, split because they need different machines and different tokens:
#
#   `build` runs on the self-hosted Mac mini. The DocC archive needs a full
#   Xcode — `Cog` imports SwiftUI and Observation, so there is no Linux build
#   of this package — and it needs the same pinned toolchain the rest of CI
#   uses. It holds a read-only token and produces the Pages artifact.
#
#   `deploy` runs on GitHub-hosted ubuntu and does nothing but publish that
#   artifact. It is the one job in this repository with a write scope, and it
#   is hosted precisely so a `pages: write` / `id-token: write` token never
#   lands on the persistent runner. `tools/check-workflows.mjs` names this
#   exact job and these exact scopes in `PERMISSION_EXCEPTIONS`, so the grant
#   is reviewed policy rather than a hole in the check.
#
# Neither trigger is reachable from a fork: tags and manual dispatch both
# require write access to this repository. The same-repo guard on the
# self-hosted job stays anyway — the guard is structural, not situational.
#
# Deployment is gated on a tag. A manual dispatch builds and uploads, which is
# what makes the artifact path testable without publishing a version that does
# not exist yet (`M4-05a`); the live site changes only when a release tag is
# pushed (`M4-05c`, verified by `M4-05d`).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Kept in step with `swift-ci.yml`. Changing one without the other means the
  # documentation describes a build nobody tested.
  COG_XCODE_VERSION: "26.6"
  COG_MISE_VERSION: "2026.8.3"

jobs:
  build:
    name: Build the DocC archive (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, cog-mini]
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.repository == 'skeswa/cog'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up mise and the tools pinned in mise.toml
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: ${{ env.COG_MISE_VERSION }}

      - name: Select the pinned Xcode and record the toolchain
        run: |
          set -euo pipefail
          # Find Xcode by VERSION, never by path — the same reasoning, and the
          # same code, as `swift-ci.yml`.
          found=""
          inventory=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version="$(/usr/bin/defaults read "$app/Contents/version" CFBundleShortVersionString 2>/dev/null || echo unknown)"
            inventory="${inventory}    ${app} -> ${version}"$'\n'
            if [ "$version" = "$COG_XCODE_VERSION" ] && [ -z "$found" ]; then
              found="$app"
            fi
          done
          echo "Installed Xcodes:"
          printf '%s' "${inventory:-    (none)}"
          if [ -z "$found" ]; then
            echo "::error title=Pinned Xcode missing::Xcode ${COG_XCODE_VERSION} is not installed on $(hostname -s). Install it, or change COG_XCODE_VERSION in this workflow and in swift-ci.yml together."
            exit 1
          fi
          developer_dir="${found}/Contents/Developer"
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" swift --version

      - name: Build the DocC archive
        run: mise run docs

      # `Package.resolved` exists only because `COG_DOCC=1` pulled in
      # swift-docc-plugin. Consumers must resolve this package with no
      # dependencies at all, so the file never leaves this job — and a
      # surviving copy would be a real defect, not a tidiness issue.
      - name: Prove the docs build left no dependency pins behind
        run: |
          set -euo pipefail
          if [ -e Package.resolved ]; then
            echo "::error title=Package.resolved survived::The docs build left dependency pins in the working tree. mise run docs must delete it."
            exit 1
          fi

      - name: Package the archive for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/docs/Cog.doccarchive

  deploy:
    name: Publish to GitHub Pages
    needs: build
    # A tag push only. A manual dispatch stops after `build`, having proven the
    # archive builds and uploads without changing what the world can see.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The repository's one write grant. See the header, and
    # `PERMISSION_EXCEPTIONS` in `tools/lib/workflows/checks.mjs`.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded archive
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
